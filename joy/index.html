<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Readings · Joy | Sibylhaus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=DM+Mono:ital,wght@0,300;0,400&display=swap">
    <style>
        :root {
            --black: #060606;
            --white: #f5f4f0;
            --gray: #a8a8a8;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--black);
            color: var(--white);
            font-family: 'DM Mono', monospace;
            font-weight: 300;
            line-height: 1.7;
            font-size: 0.95rem;
            min-height: 100vh;
            padding: 6rem 2rem 4rem;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            background: rgba(6,6,6,0.92);
            backdrop-filter: blur(12px);
        }
        nav .logo {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-decoration: none;
            color: var(--white);
        }
        .nav-controls { display: flex; gap: 1rem; align-items: center; }
        .filter-btn {
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gray);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .filter-btn.active { color: var(--white); }

        .wrap { max-width: 800px; margin: 0 auto; }

        .page-header {
            padding: 2rem 0 3rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
        }
        .eyebrow {
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 0.75rem;
        }
        .page-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -0.02em;
        }
        .page-title span {
            display: block;
            font-size: 0.4em;
            font-family: 'DM Mono', monospace;
            font-weight: 300;
            color: var(--gray);
            letter-spacing: 0.1em;
            text-transform: none;
            margin-bottom: 0.4rem;
        }

        /* Reading Table */
        .reading-table { width: 100%; border-collapse: collapse; }
        .reading-row {
            border-bottom: 1px solid var(--border);
            transition: opacity 0.3s;
        }
        .reading-row.archived { opacity: 0.4; }
        .reading-row[data-hidden="true"] { display: none; }
        .reading-cell { padding: 2rem 0; vertical-align: top; }
        .date-cell {
            width: 120px;
            font-size: 0.65rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .info-cell { padding-right: 2rem; }
        .subject-tag {
            font-size: 0.55rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            display: block;
            margin-bottom: 0.4rem;
        }
        .reading-link {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--white);
            text-decoration: none;
            display: block;
            line-height: 1.2;
        }
        .reading-link:hover { color: var(--gray); }
        .audio-cell { width: 240px; text-align: right; }
        audio {
            height: 32px;
            width: 200px;
            filter: invert(1);
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }
        .dl-link {
            font-size: 0.55rem;
            color: var(--gray);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .dl-link:hover { color: var(--white); }
        .action-cell { width: 80px; text-align: right; }
        .archive-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--gray);
            font-size: 0.5rem;
            padding: 4px 8px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
        }
        .archive-toggle:hover { border-color: var(--white); color: var(--white); }

        footer {
            margin-top: 6rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            font-size: 0.55rem;
            color: var(--gray);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }
        footer a { color: var(--gray); text-decoration: none; }
        footer a:hover { color: var(--white); }

        @media (max-width: 768px) {
            .reading-table, .reading-row, .reading-cell {
                display: block;
                width: 100%;
                text-align: left;
            }
            .date-cell { padding-bottom: 0.5rem; }
            .audio-cell { width: 100%; margin-top: 1rem; }
            audio { width: 100%; }
            .action-cell { margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }
        }
    </style>
</head>
<body>

<nav>
    <a href="https://sibylhaus.com" class="logo">Sibylhaus</a>
    <div class="nav-controls">
        <button class="filter-btn active" onclick="setFilter('active')">Active</button>
        <button class="filter-btn" onclick="setFilter('all')">All</button>
        <button class="filter-btn" onclick="setFilter('archived')">Archived</button>
    </div>
</nav>

<div class="wrap">
    <div class="page-header">
        <p class="eyebrow">Sibylhaus · Private Delivery</p>
        <h1 class="page-title">
            <span>Prepared for</span>
            Joy
        </h1>
    </div>

    <table class="reading-table">
        <tbody id="readings-body">
            <!-- Data injected here -->
        </tbody>
    </table>

    <footer>
        <span>© 2026 Sibylhaus · Private Archive</span>
        <a href="https://sibylhaus.etsy.com">Book a Reading</a>
    </footer>
</div>

<script>
    let currentFilter = 'active';
    let readingsData = [];
    const archives = JSON.parse(localStorage.getItem('joy_archives') || '[]');

    async function loadReadings() {
        try {
            const response = await fetch('readings.json');
            readingsData = await response.json();
            renderTable();
        } catch (error) {
            console.error('Error loading readings:', error);
        }
    }

    function toggleArchive(id) {
        const index = archives.indexOf(id);
        if (index > -1) {
            archives.splice(index, 1);
        } else {
            archives.push(id);
        }
        localStorage.setItem('joy_archives', JSON.stringify(archives));
        renderTable();
    }

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.toLowerCase() === f);
        });
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('readings-body');
        tbody.innerHTML = '';

        readingsData.forEach(item => {
            const isArchived = archives.includes(item.id);
            let hidden = false;
            if (currentFilter === 'active' && isArchived) hidden = true;
            if (currentFilter === 'archived' && !isArchived) hidden = true;

            if (hidden) return;

            const row = document.createElement('tr');
            row.className = `reading-row ${isArchived ? 'archived' : ''}`;
            row.innerHTML = `
                <td class="reading-cell date-cell">${item.date}</td>
                <td class="reading-cell info-cell">
                    <span class="subject-tag">${item.type}</span>
                    <a class="reading-link" href="${item.link}">${item.title}</a>
                </td>
                <td class="reading-cell audio-cell">
                    <a class="dl-link" href="${item.audio}">${item.mediaLabel}</a>
                </td>
                <td class="reading-cell action-cell">
                    <button class="archive-toggle" onclick="toggleArchive('${item.id}')">
                        ${isArchived ? 'Restore' : 'Archive'}
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    loadReadings();
</script>

</body>
</html>
